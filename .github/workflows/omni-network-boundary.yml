name: OMNI Bubblewrap network boundary (experimental)
on:
  push:
    branches: [main]
    paths:
      - "omni/network_probe.py"
      - "tests/test_network_probe.py"
      - ".github/workflows/omni-network-boundary.yml"
  workflow_dispatch:
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Prove network namespace denies external TCP
        shell: bash
        run: |
          set -o pipefail
          python3 -m omni.network_probe | tee omni-network-evidence.json
          python3 - <<'PY'
          import json
          with open("omni-network-evidence.json") as f:
              result = json.load(f)
          assert result["status"] == "NETWORK_DENIAL_OBSERVED", result
          assert result["execution_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omni-network-evidence
          path: omni-network-evidence.json

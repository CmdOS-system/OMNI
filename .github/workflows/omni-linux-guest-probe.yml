name: OMNI real Linux guest boot (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and Ubuntu guest kernel/initramfs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 linux-image-virtual
      - name: Stage readable guest kernel and initramfs with provenance\n        run: |\n          set -euo pipefail\n          sudo install -d -m 0755 /tmp/omni-guest-boot\n          kernel=$(readlink -f /boot/vmlinuz)\n          initrd=$(readlink -f /boot/initrd.img)\n          sudo install -m 0644 "$kernel" /tmp/omni-guest-boot/vmlinuz\n          sudo install -m 0644 "$initrd" /tmp/omni-guest-boot/initrd.img\n          sha256sum /tmp/omni-guest-boot/vmlinuz /tmp/omni-guest-boot/initrd.img\n      - name: Run actual guest boot probe\n        run: |
          set -euo pipefail
          python3 -m scripts.linux_guest_probe 2>&1 | tee omni-linux-guest-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omni-linux-guest-probe-evidence
          path: |
            omni-linux-guest-probe.log
            omni-linux-guest-evidence/

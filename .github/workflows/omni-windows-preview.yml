name: OMNI Windows Preview executable
on:
  push:
    branches: [main]
    paths:
      - "omni/windows_preview.py"
      - "tests/test_windows_preview.py"
      - ".github/workflows/omni-windows-preview.yml"
  workflow_dispatch:
jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preview unit tests
        run: python -m unittest discover -s tests -p test_windows_preview.py -v
      - name: Package standalone GUI
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --windowed --name OMNI-Preview omni/windows_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: OMNI-Preview-Windows
          path: dist/OMNI-Preview.exe
          if-no-files-found: error

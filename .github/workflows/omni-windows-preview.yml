name: OMNI Windows Preview executable
on:
  push:
    branches: [main]
    paths:
      - "omni/windows_preview.py"
      - "README.md"
      - "docs/ARCHITECTURE.md"
      - "engine/loader/src/package_inspector.rs"
      - "engine/loader/tests/make_fixtures.py"
      - "tests/test_windows_preview.py"
      - "tests/test_catalog.py"
      - "omni/catalog.py"
      - "omni/library_health.py"
      - "omni/library_status.py"
      - "tests/test_library_health.py"
      - "tests/test_library_status.py"
      - "omni/windows_runtime.py"
      - "tests/test_windows_runtime.py"
      - "omni/process_manager.py"
      - "omni/diagnostics.py"
      - "tests/test_diagnostics.py"
      - "omni/wsl2_discovery.py"
      - "omni/wsl2_runtime.py"
      - "omni/runtime_choices.py"
      - "omni/launch_coordinator.py"
      - "tests/test_launch_coordinator.py"
      - "tests/test_runtime_choices.py"
      - "tests/test_windows_native_smoke.py"
      - "tests/test_wsl2_runtime.py"
      - "tests/test_wsl2_discovery.py"
      - "tests/test_process_manager.py"
      - ".github/workflows/omni-windows-preview.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a downloadable prerelease only after Windows checks pass"
        required: false
        type: boolean
        default: false
jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preview unit tests
        run: python -m unittest discover -s tests -p test_windows_preview.py -v
      - run: python -m unittest discover -s tests -p test_catalog.py -v
      - name: Library integrity unit tests
        run: python -m unittest discover -s tests -p test_library_health.py -v
      - name: Library status unit tests
        run: python -m unittest discover -s tests -p test_library_status.py -v
      - name: Native Windows runtime unit tests
        run: python -m unittest discover -s tests -p test_windows_runtime.py -v
      - name: Process manager unit tests
        run: python -m unittest discover -s tests -p test_process_manager.py -v
      - name: WSL2 stderr diagnostics unit tests
        run: python -m unittest discover -s tests -p test_diagnostics.py -v
      - name: WSL2 discovery unit tests
        run: python -m unittest discover -s tests -p test_wsl2_discovery.py -v
      - name: WSL2 runtime unit tests (mocked host)
        run: python -m unittest discover -s tests -p test_wsl2_runtime.py -v
      - name: Unified runtime eligibility unit tests
        run: python -m unittest discover -s tests -p test_runtime_choices.py -v
      - name: Unified launcher unit tests
        run: python -m unittest discover -s tests -p test_launch_coordinator.py -v
      - name: Real Windows native execution smoke (whoami.exe)
        run: python -m unittest discover -s tests -p test_windows_native_smoke.py -v
      - name: Verify OMNI-only branding in current source
        shell: pwsh
        run: |
          $files = @(
            "README.md",
            "docs/ARCHITECTURE.md",
            "engine/loader/src/package_inspector.rs",
            "engine/loader/tests/make_fixtures.py"
          )
          $legacyNames = @("ne" + "xus", "ne" + "ssus")
          $matches = Select-String -Path $files -Pattern $legacyNames -AllMatches
          if ($matches) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw "Legacy branding detected in OMNI source"
          }
      - name: Package standalone GUI
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --windowed --paths . --name OMNI-Preview omni/windows_preview.py
      - name: Verify packaged Windows executable
        shell: pwsh
        run: |
          $exe = "dist/OMNI-Preview.exe"
          if (-not (Test-Path $exe)) { throw "OMNI executable missing" }
          $file = Get-Item $exe
          if ($file.Length -le 0) { throw "OMNI executable is empty" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OMNI-Preview.exe" | Set-Content -Path "dist/OMNI-Preview.exe.sha256" -Encoding ascii
          Write-Host "OMNI Windows executable size: $($file.Length) bytes"
          Write-Host "OMNI Windows SHA256: $hash"
          @(
            "## OMNI Windows Preview"
            ""
            "- Executable: OMNI-Preview.exe"
            "- Size: $($file.Length) bytes"
            "- SHA-256: $hash"
            "- Validation: tests and package checks must pass before publishing"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Validate packaged runtime and Tcl/Tk GUI initialization
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/OMNI-Preview.exe").Path
          $checks = @(
            @{ Name = "runtime"; Argument = "--self-test" },
            @{ Name = "gui"; Argument = "--gui-self-test" },
            @{ Name = "app"; Argument = "--app-self-test" }
          )
          foreach ($check in $checks) {
            $env:OMNI_SELF_TEST_REPORT = Join-Path $env:RUNNER_TEMP ("omni-" + $check.Name + "-self-test.json")
            $process = Start-Process -FilePath $exe -ArgumentList $check.Argument -PassThru
            try {
              $process | Wait-Process -Timeout 60 -ErrorAction Stop
              $process.Refresh()
              if (-not (Test-Path $env:OMNI_SELF_TEST_REPORT)) {
                throw "OMNI $($check.Name) self-test produced no diagnostic report"
              }
              $report = Get-Content $env:OMNI_SELF_TEST_REPORT -Raw | ConvertFrom-Json
              if ($process.ExitCode -ne 0 -or $report.status -ne "passed") {
                throw "OMNI $($check.Name) self-test failed: $(Get-Content $env:OMNI_SELF_TEST_REPORT -Raw)"
              }
              Write-Host "OMNI $($check.Name) packaged self-test passed"
            }
            finally {
              $process.Refresh()
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
          }
      - name: Smoke test real OMNI desktop window on Windows
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/OMNI-Preview.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          $windowFound = $false
          try {
            # A PyInstaller one-file launcher may spawn a second process.
            # Process survival alone is not proof that the GUI opened.
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              $windows = @(Get-Process -Name "OMNI-Preview" -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -eq "OMNI | Biblioteca de aplicaciones" })
              if ($windows.Count -gt 0) {
                $windowFound = $true
                Write-Host "OMNI desktop window confirmed: $($windows[0].MainWindowTitle)"
                break
              }
              if ($process.HasExited) {
                throw "OMNI GUI launcher exited before opening a desktop window (code $($process.ExitCode))"
              }
            }
            if (-not $windowFound) {
              throw "OMNI process remained alive, but no OMNI desktop window was detected within 30 seconds"
            }
          }
          finally {
            # Stop both the launcher and its extracted one-file child, if present.
            Get-Process -Name "OMNI-Preview" -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq $exe } |
              Stop-Process -Force -ErrorAction SilentlyContinue
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OMNI-Preview-Windows
          path: |
            dist/OMNI-Preview.exe
            dist/OMNI-Preview.exe.sha256
          if-no-files-found: error

      - name: Upload packaged self-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMNI-Preview-Diagnostics
          path: ${{ runner.temp }}/omni-*-self-test.json
          if-no-files-found: warn

  publish-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    needs: windows-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Preview artifact
        uses: actions/download-artifact@v4
        with:
          name: OMNI-Preview-Windows
          path: release
      - name: Verify release payload and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -s release/OMNI-Preview.exe
          test -s release/OMNI-Preview.exe.sha256
          cd release
          sha256sum --check OMNI-Preview.exe.sha256
      - name: Publish opt-in OMNI Windows prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: omni-preview-${{ github.run_number }}
          name: OMNI Windows Preview ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Experimental OMNI Windows Preview. Download OMNI-Preview.exe and
            OMNI-Preview.exe.sha256. Verify the SHA-256 checksum before opening.
            This preview is not a general cross-platform compatibility layer.
          files: |
            release/OMNI-Preview.exe
            release/OMNI-Preview.exe.sha256
          fail_on_unmatched_files: true

name: OMNI Windows Preview executable
on:
  push:
    branches: [main]
    paths:
      - "omni/windows_preview.py"
      - "tests/test_windows_preview.py"
      - "tests/test_catalog.py"
      - "omni/catalog.py"
      - "omni/library_health.py"
      - "omni/library_status.py"
      - "tests/test_library_health.py"
      - "tests/test_library_status.py"
      - "omni/windows_runtime.py"
      - "tests/test_windows_runtime.py"
      - "omni/process_manager.py"
      - "omni/diagnostics.py"
      - "tests/test_diagnostics.py"
      - "omni/wsl2_discovery.py"
      - "omni/wsl2_runtime.py"
      - "omni/runtime_choices.py"
      - "omni/launch_coordinator.py"
      - "tests/test_launch_coordinator.py"
      - "tests/test_runtime_choices.py"
      - "tests/test_windows_native_smoke.py"
      - "tests/test_wsl2_runtime.py"
      - "tests/test_wsl2_discovery.py"
      - "tests/test_process_manager.py"
      - ".github/workflows/omni-windows-preview.yml"
  workflow_dispatch:
jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preview unit tests
        run: python -m unittest discover -s tests -p test_windows_preview.py -v
      - run: python -m unittest discover -s tests -p test_catalog.py -v
      - name: Library integrity unit tests
        run: python -m unittest discover -s tests -p test_library_health.py -v
      - name: Library status unit tests
        run: python -m unittest discover -s tests -p test_library_status.py -v
      - name: Native Windows runtime unit tests
        run: python -m unittest discover -s tests -p test_windows_runtime.py -v
      - name: Process manager unit tests
        run: python -m unittest discover -s tests -p test_process_manager.py -v
      - name: WSL2 stderr diagnostics unit tests
        run: python -m unittest discover -s tests -p test_diagnostics.py -v
      - name: WSL2 discovery unit tests
        run: python -m unittest discover -s tests -p test_wsl2_discovery.py -v
      - name: WSL2 runtime unit tests (mocked host)
        run: python -m unittest discover -s tests -p test_wsl2_runtime.py -v
      - name: Unified runtime eligibility unit tests
        run: python -m unittest discover -s tests -p test_runtime_choices.py -v
      - name: Unified launcher unit tests
        run: python -m unittest discover -s tests -p test_launch_coordinator.py -v
      - name: Real Windows native execution smoke (whoami.exe)
        run: python -m unittest discover -s tests -p test_windows_native_smoke.py -v
      - name: Verify OMNI-only branding in current source
        shell: pwsh
        run: |
          $files = @(
            "README.md",
            "docs/ARCHITECTURE.md",
            "engine/loader/src/package_inspector.rs",
            "engine/loader/tests/make_fixtures.py"
          )
          $legacyNames = @("ne" + "xus", "ne" + "ssus")
          $matches = Select-String -Path $files -Pattern $legacyNames -AllMatches
          if ($matches) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw "Legacy branding detected in OMNI source"
          }
      - name: Package standalone GUI
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --windowed --paths . --name OMNI-Preview omni/windows_preview.py
      - name: Verify packaged Windows executable
        shell: pwsh
        run: |
          $exe = "dist/OMNI-Preview.exe"
          if (-not (Test-Path $exe)) { throw "OMNI executable missing" }
          $file = Get-Item $exe
          if ($file.Length -le 0) { throw "OMNI executable is empty" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OMNI-Preview.exe" | Set-Content -Path "dist/OMNI-Preview.exe.sha256" -Encoding ascii
          Write-Host "OMNI Windows executable size: $($file.Length) bytes"
          Write-Host "OMNI Windows SHA256: $hash"
          @(
            "## OMNI Windows Preview"
            ""
            "- Executable: `OMNI-Preview.exe`"
            "- Size: $($file.Length) bytes"
            "- SHA-256: `$hash`"
            "- Validation: tests and package checks must pass before publishing"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: OMNI-Preview-Windows
          path: |
            dist/OMNI-Preview.exe
            dist/OMNI-Preview.exe.sha256
          if-no-files-found: error

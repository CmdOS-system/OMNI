name: OMNI source, unit and proof tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify sources
        run: |
          set -euo pipefail
          test -s engine/loader/src/main.rs
          test -s engine/loader/src/magic_detector.rs
          test -s engine/loader/src/package_inspector.rs
          sha256sum engine/loader/src/*.rs | tee omni-source-sha256.txt
      - name: Rust unit tests only
        run: |
          set -o pipefail
          cargo test --workspace --all-targets -- --nocapture 2>&1 | tee omni-unit-tests.log
      - name: Proof consistency unit tests (not app certification)
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee omni-proof-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omni-unit-evidence
          path: |
            omni-source-sha256.txt
            omni-unit-tests.log
            omni-proof-tests.log
